[package]
name = "pipeline-desktop"
version = "0.1.6"
edition = "2021"
rust-version = "1.89"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rnaseq-desktop"
path = "src/main.rs"
required-features = ["native"]

[features]
default = []
native = ["dep:tauri", "dep:tauri-build", "dep:rfd"]

[dependencies]
pipeline-core = { path = "../pipeline-core" }
serde_json = "=1.0.149"
tauri = { version = "=2.12.1", optional = true, features = ["custom-protocol"] }
rfd = { version = "=0.15.4", optional = true, default-features = false, features = ["gtk3"] }

[build-dependencies]
tauri-build = { version = "=2.7.1", optional = true }
