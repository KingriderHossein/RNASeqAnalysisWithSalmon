[package]
name = "pipeline-core"
version = "0.1.4"
edition = "2021"
rust-version = "1.89"

[lib]
path = "src/lib.rs"

[dependencies]
flate2 = "=1.1.10"
csv = "=1.4.0"
fs4 = { version = "=1.1.0", features = ["sync"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = "=1.0.149"
sha2 = "=0.11.0"
url = "=2.5.8"
which = "=8.0.6"


[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }
