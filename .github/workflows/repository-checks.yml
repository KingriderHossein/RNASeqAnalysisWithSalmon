# Repository checks v1.0.0. No scientific execution or data downloads.
name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Syntax, documentation and cohort contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check repository files
        run: python3 scripts/check_repository_v1.py
      - name: Check Bash syntax without execution
        shell: bash
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
