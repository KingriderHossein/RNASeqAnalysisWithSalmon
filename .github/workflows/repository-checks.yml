# Repository checks v1.0.0. No scientific execution or data downloads.
name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Syntax, documentation and cohort contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check repository files
        run: python3 scripts/check_repository_v1.py
      - name: Check Bash syntax without execution
        shell: bash
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Stage 4 acquisition offline tests (no downloads)
        shell: bash
        run: |
          bash -n scripts/acquisition/sra_downloader_v1.5.0.sh
          bash scripts/acquisition/test_sra_downloader_v1.5.0.sh
          python3 -m unittest discover -s scripts/acquisition -p 'test_*.py'
          python3 scripts/acquisition/manifest_runs.py --output "$RUNNER_TEMP/GSE89223_runs.txt"
          test "$(grep -c '^SRR' "$RUNNER_TEMP/GSE89223_runs.txt")" -eq 32

  powershell-syntax:
    name: Windows PowerShell launcher syntax only
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Parse launcher (no WSL, network or download)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/acquisition/sra-downloader-wsl.ps1').Path,
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }

