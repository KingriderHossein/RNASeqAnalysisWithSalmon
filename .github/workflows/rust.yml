name: Rust

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/**"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "crates/**"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          rustup default stable
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
