name: Rust

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          rustup default stable
          rustc --version
          cargo --version

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --workspace

      - name: Frontend presentation tests
        if: ${{ !cancelled() }}
        run: node --test crates/pipeline-desktop/ui/tests/presentation.test.mjs

      - name: Resolved dependency checkpoint
        if: runner.os == 'Linux' && success()
        run: |
          echo LOCKFILE_START
          cat Cargo.lock
          echo LOCKFILE_END

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Toolchain
        run: rustup default stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - name: Native Clippy
        run: cargo clippy -p pipeline-desktop --features native --all-targets -- -D warnings
      - name: Native build
        if: ${{ !cancelled() }}
        run: cargo build -p pipeline-desktop --features native
      - name: Native Linux WebDriver
        if: runner.os == 'Linux' && success()
        run: |
          cargo install tauri-driver --version 2.1.0 --locked
          xvfb-run node crates/pipeline-desktop/tests/native-smoke.mjs

